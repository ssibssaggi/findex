plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.1'
	id 'checkstyle'
}

group = 'com.ssibssaggi'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('updateGitHook', Copy) {
	def gitHooks = ["pre-commit", "commit-msg"]
	def gitHookPath = ".git/hooks"

	from(rootProject.file("scripts")) {
		include(gitHooks)
	}
	into(rootProject.file(gitHookPath))
	doLast {
		gitHooks.forEach {hook ->
			file(gitHookPath + "/$hook").setExecutable(true, false)
		}
	}
}

spotless {
	java {
		removeUnusedImports()
		googleJavaFormat().aosp()
		importOrder('java', 'javax', 'jakarta', 'org', 'com', '', '\\#')
		trimTrailingWhitespace()
		endWithNewline()
	}
}

checkstyle {
	toolVersion = '10.12.4'
	maxWarnings = 0
	configFile = file("config/checkstyle/google_checks.xml")
}
